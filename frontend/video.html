<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video KYC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div id="navbar-placeholder"></div>

    <div class="container mt-5 pt-5">
        <div class="card card-glass mx-auto" style="max-width: 600px;">
            <div class="card-header text-center">
                <div class="card-header text-center">
                    <h3 data-i18n="video_kyc">Record Video KYC</h3>
                </div>
            </div>
            <div class="card-body text-center">
                <div id="alertMessage" class="alert d-none"></div>

                <div class="mb-4">
                    <video id="preview" autoplay muted class="w-100 bg-black"
                        style="height: 350px; object-fit: cover;"></video>
                    <div id="timer" class="mt-2 text-warning fw-bold fs-4 d-none">00:05</div>
                </div>

                <div class="d-flex justify-content-center gap-3 mb-3">
                    <button id="startBtn" class="btn btn-gradient-primary" data-i18n="start_recording">Start
                        Recording</button>
                    <button id="reRecordBtn" class="btn btn-outline-light d-none"
                        data-i18n="rerecord_video">Re-record</button>
                    <button id="uploadBtn" class="btn btn-success d-none" data-i18n="upload_video">Upload Video</button>
                </div>
                <p id="statusText" class="text-secondary small" data-i18n="upload_intro">Click Start. Recording stops
                    automatically after 5
                    seconds.</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/translations.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/navbar.js?v=2"></script>
    <script src="js/video.js?v=2"></script>
</body>

</html>
