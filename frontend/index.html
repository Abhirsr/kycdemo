<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="position-absolute top-0 end-0 p-3" id="language-switcher-placeholder"></div>
    <div class="login-card">
        <h2 class="text-center mb-4" data-i18n="login_title">KYC Portal</h2>
        <div id="alertMessage" class="alert alert-danger d-none" role="alert"></div>
        <form id="loginForm">
            <div class="mb-4">
                <label for="username" class="form-label" data-i18n="username_label">Username</label>
                <input type="text" class="form-control" id="username" required placeholder="Enter username"
                    data-i18n="username_placeholder">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label" data-i18n="password_label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Enter password"
                    data-i18n="password_placeholder">
            </div>
            <button type="submit" class="btn btn-gradient-primary w-100" data-i18n="secure_login">Secure Login</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/translations.js?v=1"></script>
    <script src="js/i18n.js?v=1"></script>
    <script src="js/auth.js?v=1"></script>
    <script src="js/login.js?v=1"></script>
</body>

</html>
