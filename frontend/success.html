<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KYC Completed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div id="navbar-placeholder"></div>

    <div class="container mt-5 pt-5">
        <div class="card card-glass mx-auto" style="max-width: 700px;">
            <div class="card-header text-center">
                <div class="card-header text-center">
                    <h2 class="text-success mb-2" data-i18n="verification_success">KYC Verification Successful!</h2>
                    <p class="text-secondary" data-i18n="kyc_complete_msg">Your details have been verified and recorded.
                    </p>
                </div>
            </div>
            <div class="card-body">
                <div class="row align-items-center mb-4">
                    <div class="col-md-6 border-end border-secondary">
                        <h5 class="text-primary mb-3" data-i18n="pan_verified">Verified Details</h5>
                        <div class="mb-3">
                            <small class="text-secondary d-block" data-i18n="full_name">Full Name</small>
                            <p class="fs-5 fw-bold text-white" id="userName">Loading...</p>
                        </div>
                        <div class="mb-3">
                            <small class="text-secondary d-block">PAN Number</small>
                            <p class="text-white" id="userPan">Loading...</p>
                        </div>
                        <div class="mb-2">
                            <small class="text-secondary d-block">Status</small>
                            <span class="badge bg-success rounded-pill px-3 py-2">Verified</span>
                        </div>
                    </div>
                    <div class="col-md-6 text-center mt-3 mt-md-0">
                        <h5 class="text-primary mb-3" data-i18n="video_kyc">Recorded Video</h5>
                        <div class="ratio ratio-16x9">
                            <video id="finalVideo" controls
                                class="rounded border border-secondary bg-black w-100"></video>
                        </div>
                        <p class="text-muted small mt-2">Your KYC video record</p>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-secondary small">Thank you for completing the process.</p>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/translations.js?v=2"></script>
        <script src="js/i18n.js?v=2"></script>
        <script src="js/auth.js?v=2"></script>
        <script src="js/navbar.js?v=2"></script>
        <script src="js/success.js?v=2"></script>
</body>

</html>
