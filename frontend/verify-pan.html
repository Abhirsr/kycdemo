<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify PAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div id="navbar-placeholder"></div>

    <div class="container mt-5 pt-5">
        <div class="card card-glass mx-auto" style="max-width: 500px;">
            <div class="card-header text-center">
                <h3 data-i18n="pan_verification">Verify PAN</h3>
                <p class="text-secondary small mb-0">Step 1 of 2</p>
            </div>
            <div class="card-body">
                <div id="alertMessage" class="alert d-none"></div>
                <form id="panForm">
                    <div class="mb-4">
                        <label class="form-label" data-i18n="enter_pan">PAN Number</label>
                        <input type="text" class="form-control" id="panNumber" required placeholder="ABCDE1234F"
                            pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" data-i18n="enter_pan">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" data-i18n="full_name">Name on PAN</label>
                        <input type="text" class="form-control" id="panName" required placeholder="Full Name"
                            data-i18n="full_name">
                    </div>
                    <button type="submit" class="btn btn-gradient-primary w-100" id="verifyBtn">
                        <span class="spinner-border spinner-border-sm d-none me-2" role="status"
                            aria-hidden="true"></span>
                        <span data-i18n="verify_pan_btn">Verify & Proceed</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/translations.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/navbar.js?v=2"></script>
    <script src="js/verify-pan.js?v=2"></script>
</body>

</html>
